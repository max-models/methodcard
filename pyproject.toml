[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools", "wheel" ]

[project]
name = "methodcard"
version = "0.1.0"
description = "The math of each numerical method, declared once and shown in its docs and tests."
readme = "README.md"
keywords = [ "documentation", "griffe", "numerical methods", "pytest", "verification" ]
license = { file = "LICENSE.txt" }
authors = [ { name = "Max" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
# PyPI rejects direct references (name @ git+...), so only version ranges go here; the
# max-models packages come from their devel branches through [tool.uv.sources]
dependencies = [
  "griffe>=2",
  "numpy",
  "scope-profiler>=0.7.5",
]
optional-dependencies.dev = [
  "jupyterlab",
  "methodcard[docs,test]",
  "pre-commit",
  "pyproject-fmt",
  "pyright",
  "ruff",
]
optional-dependencies.docs = [
  "ipykernel",
  "matplotlib>=3.10.9",
  "methodcard[symbolic]",
  "nbclient>=0.11",
  "nbformat>=5.11.1",
]
optional-dependencies.symbolic = [ "sympy" ]
optional-dependencies.test = [ "pytest", "pytest-cov", "sympy" ]
urls.Source = "https://github.com/max-models/methodcard"
scripts.methodcard = "methodcard.export:main"

[tool.setuptools]
packages.find.where = [ "src" ]
package-data."*" = [ "py.typed" ]

[tool.uv]
# PRs to devel test against the devel branches of the max-models packages (pinned in
# uv.lock); PRs to main and the release use PyPI only (CI sets UV_NO_SOURCES).
# one entry per max-models package in [project], spelled exactly like this in every repo:
# sources.cunumpy = { git = "https://github.com/max-models/cunumpy", branch = "devel" }
sources.scope-profiler = { git = "https://github.com/max-models/scope-profiler", branch = "devel" }

[tool.ruff]
target-version = "py310"
line-length = 88
extend-include = [ "*.ipynb" ]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear and pydocstyle
lint.select = [ "B", "D", "E", "F", "I", "UP", "W" ]
lint.ignore = [ "E501" ]  # line length is handled by the formatter
lint.per-file-ignores."**/tests/**" = [ "D" ]
lint.per-file-ignores."*.ipynb" = [ "D" ]
lint.per-file-ignores."docs/tools/*" = [ "D" ]
lint.pydocstyle.convention = "google"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [ "src" ]
exclude = [ "**/tests" ]

[tool.pytest]
ini_options.testpaths = [ "src" ]
ini_options.pythonpath = [ "src" ]
ini_options.addopts = "-ra -p pytester"
ini_options.markers = [ "convergence: an order-of-accuracy test of a method card (can be slow)" ]

[tool.coverage]
run.source = [ "methodcard" ]
run.omit = [ "*/tests/*" ]
report.show_missing = true
